name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
      MAHJONG_PRODUCTION_URL: ${{ vars.MAHJONG_PRODUCTION_URL || 'https://mahjong-party.youraimates.workers.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: pnpm security:secrets

      - name: Run tests
        run: pnpm test

      - name: Build packages and app
        run: pnpm build

      - name: Check Cloudflare deploy config
        run: pnpm check:cloudflare

      - name: Run production readiness checks
        run: pnpm production:check

      - name: Deploy to Cloudflare
        run: pnpm deploy:cloudflare

      - name: Smoke deployed Worker
        run: pnpm production:smoke -- "$MAHJONG_PRODUCTION_URL"
